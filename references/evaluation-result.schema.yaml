# Evaluation Core Pack - Unified Evaluation Result Schema
# All evaluator outputs must conform to this format

evaluation:
  type: object
  required: [meta, target, result]
  properties:
    meta:
      type: object
      additionalProperties: false
      required: [evaluator, version, timestamp]
      properties:
        evaluator: { type: string, description: Evaluator name }
        version: { type: string, description: Evaluator version }
        timestamp: { type: string, format: datetime }
    target:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [skill, agent_behavior, architecture, tech_choice, complete]
        id: { type: string }
        path: { type: string }
    result:
      type: object
      additionalProperties: false
      required: [verdict, score, confidence, dimensions]
      properties:
        verdict:
          type: string
          enum: [approve, needs_work, reject]
        score:
          type: number
          minimum: 0
          maximum: 100
        confidence:
          type: string
          enum: [high, medium, low]
        outcome:
          type: object
          description: "Outcome verification — validates agent claims vs actual state (optional)"
          properties:
            verified:
              type: boolean
              description: "Whether outcome verification was performed"
            claim_match:
              type: boolean
              description: "Whether agent claim matches actual state"
            state_checks:
              type: array
              items:
                type: object
                properties:
                  check: { type: string, description: "Verification check description" }
                  passed: { type: boolean }
                  evidence: { type: string, description: "Verification evidence (e.g. SQL query result)" }
        cost_analysis:
          type: object
          description: "Cost-performance analysis (optional)"
          properties:
            total_tokens: { type: integer }
            total_cost_usd: { type: number }
            cost_per_pass: { type: number }
            token_efficiency: { type: number }
            latency_avg_ms: { type: number }
        dimensions:
          type: array
          items:
            type: object
            required: [name, score, weight]
            properties:
              name: { type: string }
              score:
                type: integer
                minimum: 1
                maximum: 5
              weight: { type: number }
              detail: { type: string }
              sub_dimensions:
                type: array
                items:
                  type: object
                  required: [name, score, weight]
                  properties:
                    name: { type: string }
                    score:
                      type: integer
                      minimum: 1
                      maximum: 5
                    weight: { type: number }
                    detail: { type: string }
        trajectory:
          type: object
          properties:
            tool_selection: { type: number }
            argument_extraction: { type: number }
            result_utilization: { type: number }
            error_recovery: { type: number }
            plan_coherence: { type: number }
            task_completion: { type: number }
    trials:
      type: object
      additionalProperties: false
      description: "Multi-trial aggregation results (optional)"
      properties:
        count:
          type: integer
          description: "Total number of runs"
        pass_count:
          type: integer
          description: "Number of passes"
        pass_rate:
          type: number
          minimum: 0
          maximum: 1
          description: "Pass rate"
        scores:
          type: array
          items:
            type: number
          description: "Score for each trial"
        aggregate:
          type: string
          enum: [majority, average, all_pass]
          description: "Aggregation strategy"
        grader_results:
          type: array
          description: "Detailed grader results per trial (reserved)"
          items:
            type: object
            properties:
              type:
                type: string
                enum: [code, model, human]
              pass_rate:
                type: number
              trial_results:
                type: array
                items:
                  type: object
                  properties:
                    trial:
                      type: integer
                    passed:
                      type: boolean
                    detail:
                      type: string
    artifacts:
      type: object
      properties:
        report: { type: string }
        grading: { type: string }
        transcript: { type: string }
