# Evaluation Core Pack - 统一评价结果 Schema
# 所有 evaluator 的输出必须符合此格式

evaluation:
  type: object
  required: [meta, target, result]
  properties:
    meta:
      type: object
      additionalProperties: false
      required: [evaluator, version, timestamp]
      properties:
        evaluator: { type: string, description: evaluator 名称 }
        version: { type: string, description: evaluator 版本 }
        timestamp: { type: string, format: datetime }
    target:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [skill, agent_behavior, architecture, tech_choice, complete]
        id: { type: string }
        path: { type: string }
    result:
      type: object
      additionalProperties: false
      required: [verdict, score, confidence, dimensions]
      properties:
        verdict:
          type: string
          enum: [approve, needs_work, reject]
        score:
          type: number
          minimum: 0
          maximum: 100
        confidence:
          type: string
          enum: [high, medium, low]
        outcome:
          type: object
          description: "结果验证 — 验证 agent 声称 vs 实际状态（可选）"
          properties:
            verified:
              type: boolean
              description: "是否进行了结果验证"
            claim_match:
              type: boolean
              description: "agent 声称与实际状态是否一致"
            state_checks:
              type: array
              items:
                type: object
                properties:
                  check: { type: string, description: "验证项描述" }
                  passed: { type: boolean }
                  evidence: { type: string, description: "验证证据（如 SQL 查询结果）" }
        cost_analysis:
          type: object
          description: "成本-性能分析（可选）"
          properties:
            total_tokens: { type: integer }
            total_cost_usd: { type: number }
            cost_per_pass: { type: number }
            token_efficiency: { type: number }
            latency_avg_ms: { type: number }
        dimensions:
          type: array
          items:
            type: object
            required: [name, score, weight]
            properties:
              name: { type: string }
              score:
                type: integer
                minimum: 1
                maximum: 5
              weight: { type: number }
              detail: { type: string }
              sub_dimensions:
                type: array
                items:
                  type: object
                  required: [name, score, weight]
                  properties:
                    name: { type: string }
                    score:
                      type: integer
                      minimum: 1
                      maximum: 5
                    weight: { type: number }
                    detail: { type: string }
        trajectory:
          type: object
          properties:
            tool_selection: { type: number }
            argument_extraction: { type: number }
            result_utilization: { type: number }
            error_recovery: { type: number }
            plan_coherence: { type: number }
            task_completion: { type: number }
    trials:
      type: object
      additionalProperties: false
      description: "多次 trial 聚合结果（可选）"
      properties:
        count:
          type: integer
          description: "运行总次数"
        pass_count:
          type: integer
          description: "通过次数"
        pass_rate:
          type: number
          minimum: 0
          maximum: 1
          description: "通过率"
        scores:
          type: array
          items:
            type: number
          description: "每次 trial 的分数"
        aggregate:
          type: string
          enum: [majority, average, all_pass]
          description: "聚合策略"
        grader_results:
          type: array
          description: "每个 grader 在不同 trial 中的详细结果（预留）"
          items:
            type: object
            properties:
              type:
                type: string
                enum: [code, model, human]
              pass_rate:
                type: number
              trial_results:
                type: array
                items:
                  type: object
                  properties:
                    trial:
                      type: integer
                    passed:
                      type: boolean
                    detail:
                      type: string
    artifacts:
      type: object
      properties:
        report: { type: string }
        grading: { type: string }
        transcript: { type: string }
