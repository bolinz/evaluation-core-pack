rubric:
  name: skill-quality
  version: "1.0"
  sub_dimensions:
    - id: description_and_discoverability
      name: Description & Discoverability
      weight: 0.15
      scoring:
        5: description contains action verbs + 3-5 trigger phrases + 100-300 chars + matches skill behavior
        4: description is clear but fewer than 3 trigger phrases
        3: description is vague but purpose is understandable, no trigger phrases
        2: description is too generic, activation timing unclear
        1: no description or does not match actual behavior
      checklist:
        - description contains action verbs (create/analyze/validate/etc)
        - has 3+ natural language trigger phrases
        - description length is 100-300 characters
        - description matches actual SKILL.md content

    - id: structure_and_documentation
      name: Structure & Documentation
      weight: 0.20
      scoring:
        5: complete frontmatter + clear sections + examples + edge cases + references
        4: well-structured but missing references or incomplete examples
        3: basic structure present but missing When NOT to Use section
        2: missing several key sections
        1: no standard structure
      checklist:
        - frontmatter contains name + description
        - has Overview / Use Cases / Workflow / Examples sections
        - has When NOT to Use section
        - code blocks have language tags
        - has references/ directory for managed L3 resources

    - id: instruction_clarity
      name: Instruction Clarity
      weight: 0.25
      scoring:
        5: clear workflow + decision points + well-defined inputs/outputs + error handling
        4: steps are clear but missing error handling or edge case documentation
        3: has steps but is too vague or ambiguous
        2: steps are disorganized
        1: no executable workflow
      checklist:
        - steps are numbered and sequential
        - each step has an expected output
        - decision points have clearly stated criteria
        - error handling is documented
        - examples show complete input-to-output flow

    - id: security_and_safety
      name: Security & Safety
      weight: 0.25
      l1_gate: fail
      scoring:
        5: minimum permissions + no dangerous operations + confirmation on sensitive ops + input validation
        4: reasonable permission declarations with minor undeclared operations
        3: missing several permission declarations or has ambiguous operations
        2: contains dangerous operations (unvalidated file operations)
        1: critical security vulnerability (command injection / credential leak) -> L1 fail
      checklist:
        - declares minimum required permissions
        - no exec/eval or other dangerous calls
        - file operations have path validation and scope limits
        - network requests are limited with documented purpose
        - no hardcoded credentials

    - id: integration_quality
      name: Integration Quality
      weight: 0.15
      scoring:
        5: appropriate tool usage + cross-platform documentation + token efficiency + on-demand references
        4: tool usage is reasonable with minor redundancy
        3: excessive or inappropriate tool calls / missing cross-platform notes
        2: obvious tool misuse or SKILL.md is too large
        1: cannot cooperate with other tools or platforms
      checklist:
        - tool calls are appropriate for the task
        - cross-platform adaptations are documented
        - SKILL.md size is within reasonable bounds
        - L3 resources are loaded on-demand via references/
